<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sample Orders{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
    a { color: #2457c5; }
    nav { display: flex; gap: 1.2rem; align-items: baseline; border-bottom: 1px solid #e4e7eb; padding-bottom: .6rem; }
    nav .brand { font-weight: 700; font-size: 1.3rem; text-decoration: none; color: inherit; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #e4e7eb; }
    input[type=number] { width: 4rem; }
    input, select, button { font: inherit; padding: .3rem .4rem; }
    button { padding: .45rem 1rem; cursor: pointer; }
    form.inline { display: inline; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; margin: .6rem 0; }
    .error { background: #fde8e8; color: #9b1c1c; padding: .6rem .8rem; border-radius: 4px; }
    .muted { color: #616e7c; font-size: .9rem; }
    .badge { padding: .1rem .5rem; border-radius: 999px; background: #e4e7eb; font-size: .85rem; }
    .badge.paid { background: #def7ec; color: #03543f; }
    .badge.cancelled { background: #fde8e8; color: #9b1c1c; }
    .card { border: 1px solid #e4e7eb; border-radius: 6px; padding: .4rem 1rem; margin: 1rem 0; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">Sample Orders</a>
    <a href="/">Orders</a>
    <a href="/products">Products</a>
    <a href="/reports/sales">Sales report</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
